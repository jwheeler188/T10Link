<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- T10Link profile icon: a generic square smart thermostat (no Honeywell artwork).
       make_icon.sh turns this into honeywell_t10link.icns. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f5f6"/>
      <stop offset="1" stop-color="#c9ccd0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20252b"/>
      <stop offset="1" stop-color="#0d1013"/>
    </linearGradient>
  </defs>
  <rect x="112" y="112" width="800" height="800" rx="140" fill="url(#body)" stroke="#8d9297" stroke-width="10"/>
  <rect x="192" y="192" width="640" height="640" rx="90" fill="url(#screen)"/>
  <circle cx="512" cy="512" r="250" fill="none" stroke="#2c3a46" stroke-width="34"/>
  <path d="M 335 689 A 250 250 0 0 1 512 262" fill="none" stroke="#ff8a2a" stroke-width="34" stroke-linecap="round"/>
  <path d="M 512 262 A 250 250 0 0 1 689 335" fill="none" stroke="#3aa0ff" stroke-width="34" stroke-linecap="round"/>
  <text x="512" y="575" font-family="Helvetica, Arial, sans-serif" font-size="190" font-weight="300" fill="#ffffff" text-anchor="middle">72&#176;</text>
  <text x="512" y="660" font-family="Helvetica, Arial, sans-serif" font-size="56" fill="#9aa6b0" text-anchor="middle">LOCAL</text>
</svg>
